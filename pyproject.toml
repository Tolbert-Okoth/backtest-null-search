[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nullsearch"
version = "0.1.0"
description = "Judge a strategy search against what the same search finds in noise: sign-flip null paths, deflated Sharpe, PBO and a walk-forward clock search"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]
keywords = ["backtest overfitting", "deflated sharpe", "data mining", "multiple testing", "quant research", "walk-forward"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
